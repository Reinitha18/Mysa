# Configuration du broker MQTT de Mysa — voir chapitre 8.1 du mémoire.
#
# En réponse directe aux vulnérabilités V-01 (absence de chiffrement) et V-02
# (identifiants par défaut) identifiées au chapitre 4, le broker n'accepte
# aucune connexion anonyme et chiffre toutes les communications.
#
# Les fichiers passwd et certs/ ne sont PAS committés (voir .gitignore) :
# ils sont générés localement sur la VM hub, jamais partagés sur GitHub.

listener 8883
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key

allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.conf
