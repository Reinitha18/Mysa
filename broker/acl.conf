# Chaque appareil ne peut publier que sur ses propres topics, et ne peut lire
# que ses propres commandes. Le moteur Mysa, lui, doit tout lire (home/#)
# mais n'a besoin de publier que sur les topics de commande.

user esp32-sec-01
