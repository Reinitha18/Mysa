# Chaque appareil ne peut publier que sur ses propres topics, et ne peut lire
# que ses propres commandes. Le moteur Mysa, lui, doit tout lire (home/#)
# mais n'a besoin de publier que sur les topics de commande.

user esp32-sec-01
topic write home/esp32-sec-01/#
topic read home/esp32-sec-01/cmd/#

user esp32-cmf-01
topic write home/esp32-cmf-01/#
topic read home/esp32-cmf-01/cmd/#

user mysa-engine
topic read home/#
topic write home/+/cmd/#

# Caméra du téléphone : le hub publie le mouvement détecté avec ce compte dédié,
# restreint aux seuls topics de la caméra (home/cam-01/#).
user mysa-cam
topic write home/cam-01/#
topic read home/cam-01/cmd/#
