# Configuration Mosquitto pour le conteneur Docker (image eclipse-mosquitto:2).
# Même politique de sécurité que broker/mosquitto.conf (installation « sur la machine »), mais
# avec les chemins de l'image : /mosquitto/config et /mosquitto/certs.
#
# Répond aux vulnérabilités V-01 (chiffrement) et V-02 (identifiants) : TLS obligatoire,
# aucune connexion anonyme, droits par compte via l'ACL.

listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
