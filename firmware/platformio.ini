; mysa-firmware/platformio.ini
[platformio]
default_envs = sec01

[env]
; Version figée : sans elle, chaque PC garde la plateforme déjà installée (un PlatformIO resté sur le
; cœur Arduino 2.x / mbedTLS 2.x n'a pas le même comportement TLS ni servo).
; 8.0.0 = cœur Arduino 3.3.12 / mbedTLS 3.6.6.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
; upload_port = COM5      ; décommenter et adapter (Gestionnaire de périphériques)
; monitor_port = COM5



; ---------- Firmwares de production ----------
[env:sec01]
extra_scripts = pre:scripts/gen_config.py   ; include/mysa_config.h depuis ../.env et ../broker/certs/ca.crt
upload_speed = 115200   ; 921600 fait échouer le stub flasher sur cette carte aussi (voir cmf01 ci-dessous)
build_src_filter = +<sec01/>
build_flags = -D DEVICE_SEC01
lib_deps =
    knolleary/PubSubClient @ ^2.8
    miguelbalboa/MFRC522 @ ^1.4.11
    madhephaestus/ESP32Servo @ ^3.0.5

[env:cmf01]
extra_scripts = pre:scripts/gen_config.py
upload_speed = 115200   ; 921600 fait échouer le stub flasher sur cette carte
build_src_filter = +<cmf01/>
build_flags = -D DEVICE_CMF01
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ---------- Programmes de test matériel (sans réseau) ----------
[env:hwtest_sec]
build_src_filter = +<hwtest_sec/>
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    madhephaestus/ESP32Servo @ ^3.0.5

[env:hwtest_cmf]
build_src_filter = +<hwtest_cmf/>
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
