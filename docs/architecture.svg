<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0369B1"/>
    </marker>
    <style>
      .zone { fill:#f4f7ff; stroke:#c7d2fe; stroke-width:1.5; rx:14; }
      .ztitle { fill:#0c1f5b; font-size:14px; font-weight:700; }
      .box { fill:#ffffff; stroke:#0369B1; stroke-width:1.5; rx:10; }
      .boxc { fill:#e8f6fd; stroke:#00BAED; stroke-width:1.5; rx:10; }
      .boxw { fill:#fff6e8; stroke:#D9922E; stroke-width:1.5; rx:10; }
      .t  { fill:#0c1f5b; font-size:13px; font-weight:600; }
      .s  { fill:#44506b; font-size:11px; }
      .lnk{ stroke:#0369B1; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .lbl{ fill:#0369B1; font-size:10.5px; font-weight:600; }
    </style>
  </defs>

  <text x="24" y="34" fill="#0c1f5b" font-size="20" font-weight="700">Architecture de Mysa</text>
  <text x="24" y="54" class="s">Détection comportementale pour maison intelligente — nœuds, broker, moteur, API, dashboard, caméra, notifications, VLAN.</text>

  <!-- VLAN 20 : objets -->
  <rect class="zone" x="24" y="80" width="300" height="520" rx="14"/>
  <text x="40" y="104" class="ztitle">VLAN 20 — Objets connectés</text>

  <rect class="box" x="44" y="120" width="260" height="92" rx="10"/>
  <text x="58" y="142" class="t">ESP32 « sec-01 » (sécurité)</text>
  <text x="58" y="160" class="s">PIR, RFID, serrure servo,</text>
  <text x="58" y="176" class="s">buzzer, LED — alarme locale,</text>
  <text x="58" y="192" class="s">anti force brute, badges NVS</text>

  <rect class="box" x="44" y="226" width="260" height="78" rx="10"/>
  <text x="58" y="248" class="t">ESP32 « cmf-01 » (confort)</text>
  <text x="58" y="266" class="s">DHT22, relais lampe/prise,</text>
  <text x="58" y="282" class="s">thermostat local</text>

  <rect class="boxc" x="44" y="318" width="260" height="78" rx="10"/>
  <text x="58" y="340" class="t">Téléphone — caméra</text>
  <text x="58" y="358" class="s">page web (Chrome, HTTPS) :</text>
  <text x="58" y="374" class="s">JPEG + vignette → hub</text>

  <!-- VLAN 40 : attaquant -->
  <rect class="zone" x="24" y="412" width="300" height="100" rx="14" style="fill:#fdecea;stroke:#f3b4ad"/>
  <text x="40" y="436" class="ztitle" style="fill:#6E1712">VLAN 40 — Attaquant (lab)</text>
  <rect class="boxw" x="44" y="448" width="260" height="50" rx="10" style="fill:#fdecea;stroke:#D0433A"/>
  <text x="58" y="470" class="t" style="fill:#6E1712">VM Kali — scénarios TI-01..05</text>
  <text x="58" y="486" class="s">isolée par le pare-feu (par défaut)</text>

  <text x="40" y="548" class="s">Entrée réseau réelle (ESP32, téléphone) :</text>
  <text x="40" y="564" class="s">nœud Cloud GNS3 → carte de l'hôte.</text>
  <text x="40" y="584" class="s">Pare-feu OpenWrt : objets → hub 8883/8000</text>

  <!-- VLAN 30 : hub -->
  <rect class="zone" x="360" y="80" width="420" height="520" rx="14"/>
  <text x="376" y="104" class="ztitle">VLAN 30 — Hub Mysa (Docker)</text>

  <rect class="box" x="380" y="120" width="180" height="70" rx="10"/>
  <text x="394" y="142" class="t">Broker Mosquitto</text>
  <text x="394" y="160" class="s">MQTT TLS 8883</text>
  <text x="394" y="176" class="s">auth + ACL par compte</text>

  <rect class="box" x="380" y="214" width="380" height="150" rx="10"/>
  <text x="394" y="236" class="t">Moteur (Python)</text>
  <text x="394" y="256" class="s">• Règles explicables (contrat, surchauffe, accès)</text>
  <text x="394" y="274" class="s">• Corrélation multi-capteurs (armé+mouvement, PIR+caméra, heure)</text>
  <text x="394" y="292" class="s">• Modèle comportemental par flux (enveloppe, rythme, tendance, forêt)</text>
  <text x="394" y="310" class="s">• Présence (Last Will), chien de garde, score de risque</text>
  <text x="394" y="328" class="s">• Détection de mouvement caméra → home/cam-01/motion</text>
  <text x="394" y="348" class="s">• Épisodes + acquittement</text>

  <rect class="box" x="380" y="388" width="180" height="60" rx="10"/>
  <text x="394" y="410" class="t">Base SQLite</text>
  <text x="394" y="428" class="s">télémétrie, alertes,</text>
  <text x="394" y="442" class="s">épisodes, modèles</text>

  <rect class="box" x="580" y="388" width="180" height="60" rx="10"/>
  <text x="594" y="410" class="t">API FastAPI</text>
  <text x="594" y="428" class="s">REST + WebSocket</text>
  <text x="594" y="442" class="s">HTTPS 8000</text>

  <rect class="boxc" x="380" y="470" width="180" height="66" rx="10"/>
  <text x="394" y="492" class="t">Dashboard React</text>
  <text x="394" y="510" class="s">maison, alertes,</text>
  <text x="394" y="526" class="s">commandes, caméra live</text>

  <rect class="boxc" x="580" y="470" width="180" height="66" rx="10"/>
  <text x="594" y="492" class="t">Pont caméra</text>
  <text x="594" y="510" class="s">relais WS (sans</text>
  <text x="594" y="526" class="s">enregistrement)</text>

  <!-- Notifications -->
  <rect class="zone" x="816" y="214" width="150" height="150" rx="14" style="fill:#fff6e8;stroke:#f0cd93"/>
  <text x="830" y="238" class="ztitle" style="fill:#7A4A0E">Notifications</text>
  <rect class="boxw" x="830" y="252" width="122" height="96" rx="10"/>
  <text x="844" y="274" class="t" style="fill:#7A4A0E">Gratuites</text>
  <text x="844" y="294" class="s">e-mail (SMTP)</text>
  <text x="844" y="312" class="s">SMS (Android)</text>
  <text x="844" y="330" class="s">WhatsApp</text>

  <!-- Liens -->
  <path class="lnk" d="M304 166 L380 150"/>
  <text x="312" y="150" class="lbl">MQTT TLS</text>
  <path class="lnk" d="M304 262 L380 180"/>
  <path class="lnk" d="M304 352 L380 430"/>
  <text x="312" y="402" class="lbl">HTTPS/WS</text>

  <path class="lnk" d="M470 190 L470 214"/>
  <text x="478" y="206" class="lbl">home/#</text>
  <path class="lnk" d="M470 364 L470 388"/>
  <path class="lnk" d="M560 418 L580 418"/>
  <path class="lnk" d="M470 448 L470 470"/>
  <path class="lnk" d="M670 448 L670 470"/>
  <path class="lnk" d="M580 418 C540 470 520 470 490 470" style="stroke:#00BAED;marker-end:url(#arrow)"/>
  <path class="lnk" d="M560 300 L816 290" style="stroke:#D9922E"/>
  <text x="640" y="286" class="lbl" style="fill:#D9922E">alertes</text>
  <path class="lnk" d="M650 536 C650 560 470 560 410 536" style="stroke:#00BAED"/>
  <text x="470" y="560" class="lbl" style="fill:#00BAED">caméra en direct</text>

  <text x="24" y="636" class="s">Double cloisonnement : segmentation réseau (VLAN + pare-feu) et ACL applicative du broker. Flux détaillés : gns3/flux_matrix.md.</text>
</svg>
